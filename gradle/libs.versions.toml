[versions]
allure-java = "2.28.0"
allure-environment-writer = "1.0.0"
android-gradle-plugin = "8.4.2"
android-tools = "31.0.2"
apache-commons-collections = "4.4"
apache-commons-io = "2.6"
apache-commons-text = "1.3"
axmlparser = "1.0"
detekt = "1.23.6"
dextestparser = "2.3.4"
gson = "2.8.5"
imgscalr = "4.2"
jackson = "2.9.5"
junit5 = "5.10.3"
jsonassert = "1.5.0"
kluent = "1.64"
koin = "2.0.1"
kotlin = "1.9.24"
kotlin-logging = "1.4.9"
